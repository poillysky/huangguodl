name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # 与其它仓库命名对齐；|| 会对「未配置/空」回退
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.DOCKER_USER || github.repository_owner }}
      DH_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD || secrets.DOCKER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets
        run: |
          if [ -z "$DH_PASS" ]; then
            echo "::error::本仓库 Actions 读到的 Docker Hub 密码为空（Password required 的根因）。"
            echo "::error::打开: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "::error::确认有以下任一 Repository secret（名字必须完全一致）："
            echo "::error::  DOCKERHUB_TOKEN 或 DOCKER_PASSWORD 或 DOCKERHUB_PASSWORD 或 DOCKER_TOKEN"
            echo "::error::常见踩坑："
            echo "::error::  1) Secret 建在 Organization，但 Repository access 没勾选 huangguodl"
            echo "::error::  2) Secret 建在 Environment，而本 workflow 没用 environment:"
            echo "::error::  3) 配到了别的仓库，不是 poillysky/huangguodl"
            exit 1
          fi
          echo "Docker Hub user=$DH_USER"
          echo "Password secret: present (${#DH_PASS} chars)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DH_USER }}
          password: ${{ env.DH_PASS }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DH_USER }}/huangguodl
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
