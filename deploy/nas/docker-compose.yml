# 黄果 hg-dl — NAS 部署（单一镜像，无 .env）
# 放在：/vol1/1000/Docker/huangguodl

services:
  huangguodl:
    image: poillysky/huangguodl:v1.0.4
    container_name: huangguodl
    restart: always
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      HG_API: https://huangguoai.com
      COVER_PROXY: https://ai.wulii.de5.net
      COVER_TOKEN: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      API_TOKEN: ""
      OUT_DIR: /data/downloads
      DATA_DIR: /data/config
      STATIC_DIR: /app/static
      HOST: 0.0.0.0
      PORT: "8080"
      WORKERS: "3"
      MAX_PARALLEL_TASKS: "2"
      MAX_GLOBAL_WORKERS: "4"
    volumes:
      - /vol1/1000/Sync/115上传/黄果:/data/downloads
      - /vol1/1000/Docker/huangguodl/config:/data/config
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5)",
        ]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
