<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      iOS 主屏幕「顶栏两层」根因（见 Progressier / Red Eye Automation 等）：
      black-translucent 让页面画进刘海，若再 padding safe-area，或再叠 theme-color，
      就会看成状态栏一层 + 顶栏一层。改为 black：系统自留状态栏，应用不再垫 --safe-top。
      注意：status-bar-style 在「添加到主屏幕」时固化，改完需删图标重装。
    -->
    <meta name="theme-color" content="#16151a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="黄果剧集浏览与下载" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="黄果" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>黄果</title>
    <style>
      :root {
        --safe-top: 0px;
        --topbar-bg: #16151a;
      }
      html,
      body {
        background: #16151a;
      }
    </style>
  </head>
  <body style="background:#16151a;margin:0">
    <script>
      (function () {
        var d = document.documentElement;
        var ua = navigator.userAgent || "";
        var ios =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var standalone = false;
        try {
          standalone = !!(
            navigator.standalone ||
            (window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches)
          );
        } catch (e) {}
        if (standalone) d.classList.add("standalone");
        if (ios) d.classList.add("ios");
        /*
         * black 状态栏：系统已占刘海区，内容从状态栏下开始。
         * 切勿再写入 env(safe-area-inset-top)，否则会再垫一层空白。
         * Safari 标签页仍探测 inset（横屏等）。
         */
        try {
          var sat = 0;
          if (!(ios && standalone)) {
            var probe = document.createElement("div");
            probe.style.cssText =
              "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;" +
              "height:constant(safe-area-inset-top);height:env(safe-area-inset-top,0px);";
            d.appendChild(probe);
            sat = probe.getBoundingClientRect().height || 0;
            probe.parentNode && probe.parentNode.removeChild(probe);
          }
          d.style.setProperty("--safe-top", Math.round(sat) + "px");
        } catch (e2) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
