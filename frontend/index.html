<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!--
      iOS 主屏幕顶栏：必须用 black-translucent，让页面画进刘海，
      再由 .topbar 一次性 padding-top: safe-area，状态栏与标题同一条色带。
      若用 black：系统另占一条状态栏 + App 顶栏 = 视觉上「两层」。
      注意：status-bar-style 在「添加到主屏幕」时固化，改完需删图标重装。
    -->
    <meta name="theme-color" content="#16151a" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="黄果剧集浏览与下载" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="黄果" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>黄果</title>
    <style>
      :root {
        --safe-top: 0px;
        --topbar-bg: #16151a;
      }
      html,
      body {
        background: #16151a;
      }
    </style>
  </head>
  <body style="background:#16151a;margin:0">
    <script>
      (function () {
        var d = document.documentElement;
        var ua = navigator.userAgent || "";
        var ios =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        var standalone = false;
        try {
          standalone = !!(
            navigator.standalone ||
            (window.matchMedia &&
              window.matchMedia("(display-mode: standalone)").matches)
          );
        } catch (e) {}
        if (standalone) d.classList.add("standalone");
        if (ios) d.classList.add("ios");
        /* 探测刘海 inset，写入 --safe-top；顶栏只垫这一次，勿再叠 env() */
        try {
          var probe = document.createElement("div");
          probe.style.cssText =
            "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;" +
            "height:constant(safe-area-inset-top);height:env(safe-area-inset-top,0px);";
          d.appendChild(probe);
          var sat = probe.getBoundingClientRect().height || 0;
          probe.parentNode && probe.parentNode.removeChild(probe);
          d.style.setProperty("--safe-top", Math.round(sat) + "px");
        } catch (e2) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
