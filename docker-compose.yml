services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HG_API: ${HG_API:-https://huangguoai.com}
      OUT_DIR: /data/downloads
      DATA_DIR: /data/config
      COVER_PROXY: ${COVER_PROXY:-https://ai.wulii.de5.net}
      COVER_TOKEN: ${COVER_TOKEN:-}
      API_TOKEN: ${API_TOKEN:-}
      STATIC_DIR: /app/static
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - downloads:/data/downloads
      - appconfig:/data/config
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  downloads:
  appconfig:
